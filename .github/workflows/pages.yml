name: Publish presentation and docs

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "apps/web/public/**"
      - "apps/web/screenshots/**"
      - "apps/web/README.md"
      - "apps/desktop/README.md"
      - "crates/**/README.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "apps/web/public/**"
      - "apps/web/screenshots/**"
      - "apps/web/README.md"
      - "apps/desktop/README.md"
      - "crates/**/README.md"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install site dependencies
        working-directory: apps/site
        run: bun install --frozen-lockfile
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        working-directory: apps/site
        env:
          # configure-pages resolves project sites, user sites and custom domains.
          # PR builds use a project prefix to exercise path-safe assets and links.
          SITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || format('{0}/', steps.pages.outputs.base_path) }}
        run: bun run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
