[package]
name = "pingo-media"
description = "Native audio engine: device I/O, DSP, adaptive playout and WebRTC client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["webrtc-apm"]
webrtc-apm = ["dep:webrtc-audio-processing"]
# The published deep_filter crate has DSP primitives but no inference/model loader.
deepfilter = ["dep:deep_filter"]

[dependencies]
pingo-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
cpal = "0.16"
if-addrs = "0.14"
rtrb = "0.3"
rubato = { version = "0.16", default-features = false }
nnnoiseless = { version = "0.5", default-features = false }
opus = "0.3"
webrtc-audio-processing = { version = "2.1", features = ["bundled"], optional = true }
deep_filter = { version = "0.2.5", optional = true }

[dev-dependencies]
anyhow.workspace = true
