[package]
name = "pingo-media"
description = "Native media engine: audio/video capture, processing, encoding and WebRTC client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["webrtc-apm", "deepfilter"]
webrtc-apm = ["dep:webrtc-audio-processing"]
# DeepFilterNet3 noise suppression; without it the pipeline falls back to RNNoise.
deepfilter = ["dep:pingo-denoise"]
linux-capture = ["dep:ashpd", "dep:pipewire"]
vp8 = ["dep:ffmpeg-next"]
vaapi = ["dep:ffmpeg-next"]

[dependencies]
pingo-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
turn = "0.17.2"
webrtc-util = { version = "0.17.1", default-features = false, features = ["conn"] }
async-trait = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
cpal = "0.16"
if-addrs = "0.14"
rtrb = "0.3"
rubato = { version = "0.16", default-features = false }
nnnoiseless = { version = "0.5", default-features = false }
opus = "0.3"
webrtc-audio-processing = { version = "2.1", features = ["bundled"], optional = true }
pingo-denoise = { workspace = true, optional = true }
openh264 = "0.9.9"
yuvutils-rs = "0.8"
fast_image_resize = "6.1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"], optional = true }
pipewire = { version = "0.10", features = ["v0_3_65"], optional = true }

[dev-dependencies]
pingo-media-test-server = { path = "tests/backend-fixture" }
pingo-sfu.workspace = true
axum.workspace = true
async-trait = "0.1"
anyhow.workspace = true
