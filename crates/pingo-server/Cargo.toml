[package]
name = "pingo-server"
description = "The Pingo backend: an RxFerrix app (data, auth, files, search) that also mounts the SFU"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pingo-sfu = { workspace = true }
axum = { workspace = true }
async-trait = "0.1"
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }
pingo-proto = { workspace = true }
rxferrix = { workspace = true }
bitflags = "2"
tracing = { workspace = true }

[dev-dependencies]
pingo-media = { path = "../pingo-media" }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = "0.29"
str0m = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = { workspace = true }
